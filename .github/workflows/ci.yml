name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          check-latest: true
          cache: true

      - name: go mod download
        run: go mod download

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test -race
        run: go test -race ./...

      # Fails only when a vulnerable symbol is actually reachable from our
      # code, so an unfixable CVE deep in the graph will not redden unrelated
      # PRs. Unreachable ones are Dependabot's job, not this gate's.
      #
      # GO-2026-6443 is allowlisted: vuln.go.dev's version range wrongly covers
      # the released grpc v1.84.0, which already carries the fix (grpc-go#9370).
      # The correction is pending in golang/vulndb#6580. Once this step warns
      # that the ID is no longer reported, delete the allowlist.
      - name: govulncheck
        shell: bash
        run: |
          go run golang.org/x/vuln/cmd/govulncheck@latest -format json ./... > govulncheck.json
          # Reachable findings have a symbol in trace[0]; module/package-level ones do not.
          reachable=$(jq -r 'select(.finding) | .finding | select(.trace[0].function != null) | .osv' govulncheck.json | sort -u)
          jq -r 'select(.finding) | .finding | select(.trace[0].function != null) | "\(.osv)  \(.trace[0].module)@\(.trace[0].version)  fixed: \(.fixed_version // "n/a")  via: \(.trace[-1].position.filename):\(.trace[-1].position.line)"' govulncheck.json | sort -u
          [ -n "$reachable" ] || echo "No reachable vulnerabilities."
          allowlisted=GO-2026-6443
          if ! grep -qxF "$allowlisted" <<<"$reachable"; then
            echo "::warning::$allowlisted is no longer reported; remove its allowlist from ci.yml"
          fi
          remaining=$(grep -vxF "$allowlisted" <<<"$reachable" || true)
          if [ -n "$remaining" ]; then
            echo "Reachable vulnerabilities not allowlisted:"
            echo "$remaining"
            exit 1
          fi
