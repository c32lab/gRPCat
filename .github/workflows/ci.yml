name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          cache: true

      - name: go mod download
        run: go mod download

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test -race
        run: go test -race ./...

      # Exits 3 only when a vulnerable symbol is actually reachable from our
      # code, so an unfixable CVE deep in the graph will not redden unrelated
      # PRs. Unreachable ones are Dependabot's job, not this gate's.
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
